services:
  postgres:
    image: postgres:16
    container_name: dress-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dress-net
    # Порт наружу НЕ публикуется — доступ только из сети dress-net (см. deploy-guide.md, шаг 2).

  redis:
    image: redis:7-alpine
    container_name: dress-redis
    restart: unless-stopped
    networks:
      - dress-net
    # Порт наружу не публикуется: очередь фоновых задач доступна только backend/worker.

  backend:
    build: .
    container_name: dress-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - media_data:/app/media
    networks:
      - dress-net

  # Фоновые задачи модуля «Мастер-данные» (долгий импорт, МД-35)
  worker:
    build: .
    container_name: dress-worker
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - media_data:/app/media
    networks:
      - dress-net
    healthcheck:
      disable: true

  nginx:
    image: nginx:alpine
    container_name: dress-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      # - "443:443"   # раскомментировать на шаге 9.5 deploy-guide.md
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/media:ro
      # - certbot_certs:/etc/letsencrypt:ro   # добавить на шаге 9.3
      # - certbot_www:/var/www/certbot        # добавить на шаге 9.3
    networks:
      - dress-net

networks:
  dress-net:
    name: dress-net

volumes:
  postgres_data:
  media_data:
