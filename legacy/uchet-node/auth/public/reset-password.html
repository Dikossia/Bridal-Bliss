<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый пароль — Учёт</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="card" id="box">
    <div class="brand">
        <h1>Учёт</h1>
        <p>Восстановление доступа</p>
    </div>
    
    <h2>Новый пароль</h2>
    
    <form id="resetForm">
        <div class="field">
            <label for="password">Новый пароль</label>
            <input type="password" id="password" required>
        </div>
        
        <div class="pwd-rules">
            <div class="rule" id="ruleLen"><span class="icon">✕</span> Не менее 10 символов</div>
            <div class="rule" id="ruleLet"><span class="icon">✕</span> Минимум одна латинская буква</div>
            <div class="rule" id="ruleNum"><span class="icon">✕</span> Минимум одна цифра</div>
            <div class="rule" id="ruleSpec"><span class="icon">✕</span> Минимум один спецсимвол (@$!%*?&...)</div>
        </div>

        <div class="field">
            <label for="confirm">Повторите пароль</label>
            <input type="password" id="confirm" required>
            <div id="matchIndicator" class="match-indicator"></div>
        </div>

        <button type="submit" class="primary" id="submitBtn" disabled>Сохранить пароль</button>
    </form>

    <div id="msg" class="alert" style="display: none;"></div>
</div>

<script>
    // Извлекаем токен из URL (?token=...)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || '';

    // Проверяем валидность формата токена
    if (!/^[a-f0-9]{64}$/.test(token)) {
        document.getElementById('box').innerHTML = `
            <div class="brand">
                <h1>Учёт</h1>
            </div>
            <h2>Ошибка</h2>
            <div class="alert alert-error" style="display:block; text-align:center;">
                Некорректная или устаревшая ссылка восстановления.
            </div>
            <div class="link-row">
                <a href="/login">Вернуться на страницу входа</a>
            </div>`;
    } else {
        const pwdInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm');
        const submitBtn = document.getElementById('submitBtn');
        const msg = document.getElementById('msg');
        const matchIndicator = document.getElementById('matchIndicator');

        // Утилита для красивого переключения правил под стиль styles.css
        function toggleRuleStatus(elementId, isValid) {
            const el = document.getElementById(elementId);
            const icon = el.querySelector('.icon');
            if (isValid) {
                el.classList.add('ok');
                icon.textContent = '✓';
            } else {
                el.classList.remove('ok');
                icon.textContent = '✕';
            }
        }

        // Живая валидация пароля на клиенте
        function validateForm() {
            const val = pwdInput.value;
            const conf = confirmInput.value;

            const hasLen = val.length >= 10;
            const hasLet = /[A-Za-z]/.test(val); 
            const hasNum = /[0-9]/.test(val);
            const hasSpec = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(val);
            const matches = val === conf && val.length > 0;

            // Обновляем чек-лист требований
            toggleRuleStatus('ruleLen', hasLen);
            toggleRuleStatus('ruleLet', hasLet);
            toggleRuleStatus('ruleNum', hasNum);
            toggleRuleStatus('ruleSpec', hasSpec);

            // Обновляем индикатор совпадения паролей (.match-indicator ok/bad)
            if (conf.length === 0) {
                matchIndicator.textContent = '';
                matchIndicator.className = 'match-indicator';
            } else if (val === conf) {
                matchIndicator.textContent = 'Пароли совпадают';
                matchIndicator.className = 'match-indicator ok';
            } else {
                matchIndicator.textContent = 'Пароли не совпадают';
                matchIndicator.className = 'match-indicator bad';
            }

            submitBtn.disabled = !(hasLen && hasLet && hasNum && hasSpec && matches);
        }

        pwdInput.addEventListener('input', validateForm);
        confirmInput.addEventListener('input', validateForm);

        // Отправка формы
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            msg.style.display = 'none';

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password: pwdInput.value })
                });
                const data = await res.json();

                msg.style.display = 'block';
                if (data.ok) {
                    msg.className = 'alert alert-success';
                    msg.textContent = 'Пароль успешно изменен! Перенаправление на вход...';
                    setTimeout(() => window.location.href = '/login', 3000);
                } else {
                    msg.className = 'alert alert-error';
                    msg.textContent = data.error || 'Ошибка изменения пароля.';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                msg.style.display = 'block';
                msg.className = 'alert alert-error';
                msg.textContent = 'Ошибка соединения с сервером.';
                submitBtn.disabled = false;
            }
        });
    }
</script>
</body>
</html>
