<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Установка пароля — Учёт</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="card" id="root">
    <div class="brand"><h1>Учёт</h1></div>
    <p class="center" style="color:#666">Проверка ссылки...</p>
</div>

<script>
const $ = id => document.getElementById(id);

const params = new URLSearchParams(location.search);
const token = params.get('token') || '';

async function init() {
    if (!/^[a-f0-9]{64}$/.test(token)) {
        renderInvalid();
        return;
    }
    try {
        const r = await fetch('/api/verify-token?token=' + encodeURIComponent(token));
        const data = await r.json();
        if (data.ok) renderForm();
        else renderInvalid();
    } catch {
        renderInvalid();
    }
}

function renderInvalid() {
    $('root').innerHTML = `
        <div class="brand"><h1>Учёт</h1></div>
        <h2 class="center">Ссылка недействительна</h2>
        <p class="center" style="color:#666">
            Ссылка истекла или уже была использована. Пройдите регистрацию заново.
        </p>
        <div class="link-row"><a href="/register">К регистрации</a></div>`;
}

function renderForm() {
    $('root').innerHTML = `
        <div class="brand"><h1>Учёт</h1></div>
        <h2>Установите пароль</h2>
        <p class="subtitle">Придумайте надёжный пароль для входа в систему.</p>

        <div id="alert"></div>

        <form id="pwd-form" novalidate>
            <div class="field">
                <label for="p1">Новый пароль</label>
                <div class="password-wrap">
                    <input id="p1" type="password" autocomplete="new-password" required>
                    <button type="button" class="toggle-pwd" data-target="p1">Показать</button>
                </div>
            </div>

            <div class="pwd-rules" id="rules">
                <div class="rule" data-rule="len">    <span class="icon">✓</span> Минимум 10 символов</div>
                <div class="rule" data-rule="letter"> <span class="icon">✓</span> Минимум одна буква (a–z, A–Z)</div>
                <div class="rule" data-rule="digit">  <span class="icon">✓</span> Минимум одна цифра</div>
                <div class="rule" data-rule="special"><span class="icon">✓</span> Минимум один спецсимвол (!@#$…)</div>
            </div>

            <div class="field">
                <label for="p2">Повторите пароль</label>
                <div class="password-wrap">
                    <input id="p2" type="password" autocomplete="new-password" required>
                    <button type="button" class="toggle-pwd" data-target="p2">Показать</button>
                </div>
                <div class="match-indicator" id="match"></div>
            </div>

            <button class="primary" type="submit" id="submit" disabled>Установить пароль</button>
        </form>`;

    bindForm();
}

const SPECIAL_RE = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/;

function checks(p) {
    return {
        len:     p.length >= 10,
        letter:  /[A-Za-z]/.test(p),
        digit:   /[0-9]/.test(p),
        special: SPECIAL_RE.test(p),
    };
}

function bindForm() {
    const p1 = $('p1'), p2 = $('p2'), submit = $('submit'), match = $('match');

    function updateRules() {
        const c = checks(p1.value);
        let allOk = true;
        for (const k of ['len','letter','digit','special']) {
            const el = document.querySelector(`.rule[data-rule="${k}"]`);
            el.classList.toggle('ok', c[k]);
            if (!c[k]) allOk = false;
        }
        updateMatch(allOk);
    }

    function updateMatch(allRulesOk) {
        if (!p2.value) {
            match.textContent = '';
            match.className = 'match-indicator';
            submit.disabled = true;
            return;
        }
        const same = p1.value === p2.value;
        match.textContent = same ? '✓ Пароли совпадают' : '✗ Пароли не совпадают';
        match.className = 'match-indicator ' + (same ? 'ok' : 'bad');
        submit.disabled = !(allRulesOk && same);
    }

    p1.addEventListener('input', updateRules);
    p2.addEventListener('input', updateRules);

    document.querySelectorAll('.toggle-pwd').forEach(btn => {
        btn.addEventListener('click', () => {
            const t = $(btn.dataset.target);
            const showing = t.type === 'text';
            t.type = showing ? 'password' : 'text';
            btn.textContent = showing ? 'Показать' : 'Скрыть';
        });
    });

    $('pwd-form').addEventListener('submit', async e => {
        e.preventDefault();
        const password = p1.value;
        submit.disabled = true;
        submit.textContent = 'Сохранение...';

        try {
            const r = await fetch('/api/set-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ token, password })
            });
            const data = await r.json();
            if (data.ok) {
                renderSuccess();
            } else {
                $('alert').innerHTML = `<div class="alert alert-error">${data.error || 'Ошибка'}</div>`;
                submit.disabled = false;
                submit.textContent = 'Установить пароль';
            }
        } catch {
            $('alert').innerHTML = `<div class="alert alert-error">Сетевая ошибка</div>`;
            submit.disabled = false;
            submit.textContent = 'Установить пароль';
        }
    });
}

function renderSuccess() {
    $('root').innerHTML = `
        <div class="brand"><h1>Учёт</h1></div>
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 class="center">Регистрация прошла успешно!</h2>
        <p class="center" style="color:#666">Теперь вы можете войти в систему, используя ваш email и пароль.</p>
        <a href="/login"><button class="primary" type="button">Войти в систему</button></a>`;
}

init();
</script>
</body>
</html>
