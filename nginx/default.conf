# Начальная HTTP-конфигурация (шаги 1-8 deploy-guide.md).
# Когда дойдёте до шага 9 (домен + HTTPS) — замените этот файл на версии
# из deploy-guide.md (9.2, затем 9.5), они добавляют ACME-challenge,
# редирект на HTTPS и 443-блок с сертификатами Let's Encrypt.
server {
    listen 80;
    server_name _;

    client_max_body_size 200M;   # импорт XLSX до 10 000 строк и ZIP с фото (МД-26, МД-34)

    # Фото и импорты мастер-данных НЕ отдаются напрямую из /media: доступ
    # к ним только по подписанным ссылкам Django (§8 — ссылки с ограниченным сроком).
    location /media/md/ {
        return 404;
    }
    location /media/ {
        alias /media/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # предпросмотр импорта до ~1000 строк выполняется в запросе
    }
}
