<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля — Учёт</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="card" id="root">
    <div class="brand">
        <h1>Учёт</h1>
        <p>Система учёта товаров и продаж</p>
    </div>

    <h2>Восстановление пароля</h2>
    <p class="subtitle">Введите ваш Email, и мы отправим вам ссылку для восстановления доступа.</p>

    <div id="alert"></div>

    <form id="forgot-form" novalidate>
        <div class="field">
            <label for="email">Электронная почта</label>
            <input id="email" type="email" autocomplete="email" required>
            <div class="error-text" id="err-email"></div>
        </div>

        <button class="primary" type="submit" id="submit">Получить ссылку</button>
    </form>

    <div class="link-row">
        <a href="/login">Вернуться на страницу входа</a>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
const form = $('forgot-form');
const submitBtn = $('submit');
const alertBox = $('alert');
const EMAIL_RE = /^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/;

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    $('err-email').textContent = '';
    $('email').classList.remove('invalid');
    alertBox.innerHTML = '';

    const email = $('email').value.trim().toLowerCase();

    if (!EMAIL_RE.test(email)) {
        $('err-email').textContent = 'Введите корректный email';
        $('email').classList.add('invalid');
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Отправка...';

    try {
        // Запрос идет на ваш существующий роут из server.js
        const r = await fetch('/api/forgot-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email })
        });
        const data = await r.json();

        if (data.ok) {
            $('root').innerHTML = `
                <div class="brand"><h1>Учёт</h1></div>
                <h2 class="center">Инструкция отправлена!</h2>
                <p class="center" style="color:#666; font-size: 14px; line-height: 1.5;">
                    Если указанный адрес зарегистрирован в системе, в течение пары минут вы получите письмо со ссылкой для сброса пароля.
                </p>
                <div class="link-row"><a href="/login">Вернуться на форму входа</a></div>`;
        } else {
            alertBox.innerHTML = `<div class="alert alert-error">${data.error || 'Ошибка запроса'}</div>`;
            submitBtn.disabled = false;
            submitBtn.textContent = 'Получить ссылку';
        }
    } catch {
        alertBox.innerHTML = `<div class="alert alert-error">Сетевая ошибка. Попробуйте позже.</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Получить ссылку';
    }
});
</script>
</body>
</html>
