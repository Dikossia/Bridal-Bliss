# Начальная HTTP-конфигурация (шаги 1-8 deploy-guide.md).
# Когда дойдёте до шага 9 (домен + HTTPS) — замените этот файл на версии
# из deploy-guide.md (9.2, затем 9.5), они добавляют ACME-challenge,
# редирект на HTTPS и 443-блок с сертификатами Let's Encrypt.
server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location /media/ {
        alias /media/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
